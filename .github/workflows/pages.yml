name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          python scripts/build.py
          python scripts/verify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Enforce HTTPS once the certificate is issued
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages=$(gh api repos/${{ github.repository }}/pages)
          state=$(echo "$pages" | jq -r '.https_certificate.state // "none"')
          desc=$(echo "$pages" | jq -r '.https_certificate.description // ""')
          enforced=$(echo "$pages" | jq -r '.https_enforced')
          echo "certificate: $state | enforced: $enforced"
          {
            echo "## HTTPS status"
            echo "- certificate state: **$state**"
            echo "- description: $desc"
            echo "- https_enforced: **$enforced**"
            echo "- cname: $(echo "$pages" | jq -r '.cname')"
            echo "- domains: $(echo "$pages" | jq -c '.https_certificate.domains // []')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$state" = "approved" ] && [ "$enforced" != "true" ]; then
            gh api -X PUT repos/${{ github.repository }}/pages -F https_enforced=true
            echo "Enforce HTTPS enabled"
          fi
