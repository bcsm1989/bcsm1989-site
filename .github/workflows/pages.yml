name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml
  build:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          python scripts/build.py
          python scripts/verify.py
          python scripts/test_security.py
          node --check dist/app.js
          node --check dist/fleet/fleet.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Enforce HTTPS once the certificate is issued
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages=$(gh api repos/${{ github.repository }}/pages)
          state=$(echo "$pages" | jq -r '.https_certificate.state // "none"')
          desc=$(echo "$pages" | jq -r '.https_certificate.description // ""')
          enforced=$(echo "$pages" | jq -r '.https_enforced')
          echo "certificate: $state | enforced: $enforced"
          {
            echo "## HTTPS status"
            echo "- certificate state: **$state**"
            echo "- description: $desc"
            echo "- https_enforced: **$enforced**"
            echo "- cname: $(echo "$pages" | jq -r '.cname')"
            echo "- domains: $(echo "$pages" | jq -c '.https_certificate.domains // []')"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$state" = "approved" ] && [ "$enforced" != "true" ]; then
            gh api -X PUT repos/${{ github.repository }}/pages -F https_enforced=true
            echo "Enforce HTTPS enabled"
          fi
